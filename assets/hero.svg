<svg width="900" height="440" viewBox="0 0 900 440" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: 'SF Mono','Fira Code',Consolas,'Liberation Mono',monospace; font-size: 16px; }
    .p { fill: #6e7681; }
    .c { fill: #adb5bd; }
    .o { fill: #e6edf3; }
    .h { fill: #f0f3f6; font-weight: 600; font-size: 20px; }
    .m { fill: #8b949e; }
    .type { clip-path: inset(0 100% 0 0); animation: type var(--d) steps(var(--n), end) var(--t) forwards; }
    .fade { opacity: 0; animation: fade .5s ease var(--t) forwards; }
    .cur  { opacity: 0; animation: fade .1s linear 6s forwards, blink 1.1s steps(1) 6s infinite; }
    @keyframes type  { to { clip-path: inset(0 0 0 0); } }
    @keyframes fade  { to { opacity: 1; } }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11151b"/>
      <stop offset="1" stop-color="#0b0e13"/>
    </linearGradient>
  </defs>

  <rect width="900" height="440" rx="14" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="899" height="439" rx="13.5" fill="none" stroke="#262c34"/>

  <!-- title bar -->
  <path d="M0 14a14 14 0 0 1 14-14h872a14 14 0 0 1 14 14v30H0z" fill="#161b22"/>
  <line x1="0" y1="44.5" x2="900" y2="44.5" stroke="#262c34"/>
  <circle cx="28" cy="22" r="5" fill="#30363d"/>
  <circle cx="48" cy="22" r="5" fill="#30363d"/>
  <circle cx="68" cy="22" r="5" fill="#30363d"/>
  <text x="450" y="27" text-anchor="middle" class="m" style="font-size:13px;letter-spacing:1px">harsh — zsh</text>

  <!-- 1 -->
  <text x="36" y="96" class="p">~ $</text>
  <text x="76" y="96" class="c type" style="--d:.5s;--n:6;--t:.4s">whoami</text>
  <text x="36" y="126" class="h fade" style="--t:1s">Harsh Rajput</text>

  <!-- 2 -->
  <text x="36" y="174" class="p">~ $</text>
  <text x="76" y="174" class="c type" style="--d:.8s;--n:12;--t:1.6s">cat role.txt</text>
  <text x="36" y="204" class="o fade" style="--t:2.5s">Full-Stack Developer  /  B.Tech Information Technology</text>

  <!-- 3 -->
  <text x="36" y="252" class="p">~ $</text>
  <text x="76" y="252" class="c type" style="--d:.8s;--n:13;--t:3.2s">cat focus.txt</text>
  <text x="36" y="282" class="o fade" style="--t:4.1s">Backend  ·  Next.js  ·  DSA  ·  System Design</text>

  <!-- 4 -->
  <text x="36" y="330" class="p">~ $</text>
  <text x="76" y="330" class="c type" style="--d:.6s;--n:9;--t:4.8s">echo $NOW</text>
  <text x="36" y="360" class="o fade" style="--t:5.5s">Exploring AI &amp; ML. Preparing for software engineering roles.</text>

  <!-- cursor -->
  <text x="36" y="408" class="p fade" style="--t:6s">~ $</text>
  <rect x="76" y="394" width="9" height="18" fill="#8b949e" class="cur"/>
</svg>